<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วรรณคดีไทยเรื่องโปรดของคุณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#651b22;--red2:#8f2932;--gold:#e6c77a;--cream:#fff8e9;--ink:#34231e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);font-family:Kanit,sans-serif;background:radial-gradient(ellipse at 50% 0%,#a13c3c 0,#651b22 48%,#2b1017 100%);display:grid;place-items:center;padding:24px}
.wrap{width:min(900px,100%);text-align:center}.ornament{color:var(--gold);font-size:24px;letter-spacing:12px;margin-bottom:18px}
.panel{position:relative;padding:clamp(30px,7vw,72px) 24px;border:1px solid rgba(230,199,122,.65);border-radius:24px;background:linear-gradient(145deg,rgba(255,248,233,.09),rgba(30,8,12,.28));box-shadow:0 25px 70px #18070b80;overflow:hidden}
.panel:before,.panel:after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(230,199,122,.3);transform:rotate(45deg)}.panel:before{top:-110px;left:-90px}.panel:after{bottom:-110px;right:-90px}
.kicker{color:var(--gold);letter-spacing:3px;font-size:13px}.title{font-family:"Noto Serif Thai",serif;font-size:clamp(32px,6vw,58px);line-height:1.35;margin:14px 0;color:#fff4d8}.sub{color:#f1ddc4;max-width:580px;margin:0 auto 30px;line-height:1.9}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 32px}.stat{border:1px solid #e6c77a66;border-radius:999px;padding:8px 16px;color:#f8e7bd;font-size:14px}
button{font:600 17px Kanit;border:0;border-radius:999px;padding:14px 34px;background:linear-gradient(135deg,#f4d98e,#c99b4b);color:#42181c;cursor:pointer;box-shadow:0 8px 24px #16060a55;transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(1.06)}
.note{font-size:12px;color:#d7bca7;margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
  <div class="ornament">✦ ❖ ✦</div>
  <section class="panel">
    <div class="kicker">THAI LITERATURE • PICK YOUR FAVORITE</div>
    <h1 class="title">วรรณคดีไทย<br>เรื่องโปรดของคุณ</h1>
    <p class="sub">ถ้าต้องเลือกวรรณคดีไทยได้เพียงเรื่องเดียว คุณจะเลือกเรื่องไหน?<br>มาประชันความชอบแบบตัวต่อตัว แล้วค้นหาเรื่องที่ใช่ที่สุดสำหรับคุณ</p>
    <div class="stats">
      <span class="stat">16 วรรณคดี</span>
      <span class="stat">15 รอบการเลือก</span>
      <span class="stat">1 เรื่องที่ชนะใจคุณ</span>
    </div>
    <button onclick="location.href='game.html'">เริ่มเกม ✦</button>
    <div class="note">เลือกจากความชอบส่วนตัว ไม่มีคำตอบถูกหรือผิด</div>
  </section>
  <div class="ornament" style="margin-top:18px">❖ ✦ ❖</div>
</main>
</body>
</html>
